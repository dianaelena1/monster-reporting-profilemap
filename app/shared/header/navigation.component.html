<ul *ngIf="!isLoginPage" class="navbar-nav float-start me-auto">
    <li class="nav-item">
        <a class="nav-link waves-effect waves-dark" href="/dashboard"> Home </a>
    </li>
    <li class="nav-item">
        <a class="nav-link waves-effect waves-dark" href="/about"> About </a>
    </li>
    <!-- ============================================================== -->
    <!-- create new -->
    <!-- ============================================================== -->
    <li class="nav-item d-none d-md-block" ngbDropdown placement="bottom-end">
        <a href="javascript:void(0)" class="nav-link" id="dropdownBasic1" ngbDropdownToggle>
            Reports
        </a>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
            <a ngbDropdownItem href="/new-test-cycle">New</a>

<!-- ============================================================== -->
<!-- Right side toggle and nav items -->
<!-- ============================================================== -->
<ul *ngIf="!isLoginPage" class="navbar-nav float-end">
    <!-- ============================================================== -->
    <!-- User profile and search -->
    <!-- ============================================================== -->
    <li class="nav-item" ngbDropdown placement="bottom-end">
        <a
            ngbDropdownToggle
            class="nav-link waves-effect waves-dark pro-pic"
            href="javascript:void(0)"
            data-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false">
            <img
                src="../../../assets//images/users/Diana.png"
                alt="user"
                class="rounded-circle"
                width="31" />
            <span class="ms-2">{{ userName || 'Diana Horincar' }}</span>
        </a>
        <div class="dropdown-menu-right" ngbDropdownMenu>
            <a class="dropdown-item" href="/user-profile"> My Profile</a>
            <a class="dropdown-item" href="javascript:void(0)"> Inbox</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="javascript:void(0)"> Account Setting</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="/login"> Logout</a>
        </div>
    </li>
    <!-- ============================================================== -->
    <!-- User profile and search -->
    <!-- ============================================================== -->
</ul>
