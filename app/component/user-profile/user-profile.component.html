<div class="user-profile">
  <form [formGroup]="userProfileForm" (ngSubmit)="onSubmit()">
    <mat-card>
      <mat-card-header>
        <h2>User Profile</h2>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-label>Profile Photo</mat-label>
          <input type="file" (change)="onFileChange($event)" accept="image/*" />
          <mat-error *ngIf="fileError">{{ fileError }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input
            formControlName="name"
            matInput
            placeholder="Enter your name"
            maxlength="10"
          />
          <mat-error *ngIf="userProfileForm.get('name')?.hasError('maxlength')">
            Name cannot exceed 10 characters
          </mat-error>
          <mat-error *ngIf="userProfileForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions>
        <button
          class="btn btn-log-in-profile-map"
          mat-raised-button
          color="primary"
          type="submit"
        >
          Save
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
