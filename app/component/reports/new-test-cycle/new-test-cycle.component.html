<div class="container mt-4">
    <h2>Create New Test Cycle</h2>
    <form [formGroup]="testCycleForm" (ngSubmit)="onSubmit()">
        <div class="form-group mb-3">
            <input
                type="text"
                class="form-control"
                formControlName="name"
                id="testCycleName"
                placeholder="Test cycle name"
                required />
        </div>
        <div class="form-group mb-3">
            <input
                type="text"
                class="form-control"
                formControlName="folder"
                id="testCycleFolder"
                placeholder="Folder"
                required />
        </div>
        <div class="form-group mb-3">
            <textarea
                class="form-control"
                formControlName="labels"
                id="testCycleLabels"
                rows="3"
                placeholder="Labels"
                required></textarea>
        </div>
        <button (click)="onSubmit()" class="btn btn-profile-map">Create Test Cycle</button>
    </form>

    <hr />

    <button class="btn btn-secondary btn-profile-map:hover">Generate HTML Report</button>
</div>
