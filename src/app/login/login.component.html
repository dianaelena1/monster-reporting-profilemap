<div class="wrap-login">
  <div class="container">
    <form
      class="form-login-class"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >
      <mat-card class="login-box">
        <mat-card-header>
          <img
            mat-card-avatar
            src="../../../assets//images/logos/login-icon.png"
            alt="Logo"
          />
        </mat-card-header>
        <mat-card-content>
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input
              [(ngModel)]="email"
              matInput
              type="email"
              placeholder="Enter your email"
              formControlName="email"
              required
              class="form-field"
            />
            <mat-error
              *ngIf="
                loginForm.get('email')?.hasError('required') &&
                !errorMessage &&
                !registerMessage
              "
              >Email is required</mat-error
            >
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')"
              >Invalid email format</mat-error
            >
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input
              [(ngModel)]="password"
              matInput
              type="password"
              placeholder="Enter your password"
              formControlName="password"
              required
              class="form-field"
            />

            <mat-error
              *ngIf="
                loginForm.get('password')?.hasError('required') &&
                !errorMessage &&
                !registerMessage
              "
            >
              Password is required
            </mat-error>
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')"
              >Password should be at least 6 characters long</mat-error
            >
          </mat-form-field>

          <mat-form-field appearance="outline" *ngIf="showRePassword">
            <mat-label>Re-Password</mat-label>
            <input
              matInput
              type="password"
              placeholder="Re-Enter your password"
              formControlName="repassword"
              required
              class="form-field"
            />

            <mat-error *ngIf="loginForm.get('repassword')?.hasError('required')"
              >Matching Password is required</mat-error
            >
            <mat-error
              *ngIf="
                loginForm.get('repassword')?.value !==
                  loginForm.get('password')?.value && errorMessage
              "
              >Passwords do not match</mat-error
            >
          </mat-form-field>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>

          <!-- Register Message -->
          <div *ngIf="registerMessage" class="register-message">
            {{ registerMessage }}
          </div>
        </mat-card-content>
        <mat-card-actions>
          <!-- Login Button -->
          <button
            class="btn btn-log-in-profile-map"
            color="primary"
            type="submit"
            *ngIf="!showRePassword"
          >
            Login
          </button>
          <!-- Cancel Button -->
          <button
            class="btn cancel-btn-log-in-profile-map"
            color="warn"
            (click)="onCancel()"
            *ngIf="showRePassword"
          >
            Cancel
          </button>
          <!-- Register Button -->
          <button
            class="btn btn-log-in-profile-map"
            color="primary"
            (click)="onRegister()"
            *ngIf="!showRePassword"
          >
            Register
          </button>
          <!-- Confirm Button -->
          <button
            class="btn btn-log-in-profile-map"
            color="primary"
            (click)="onConfirm()"
            *ngIf="showRePassword && showConfirmButton"
          >
            Confirm
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
